<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Antigravity P2P Call</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
    h1 { color: #3b82f6; }
    video { width: 45%; max-width: 480px; height: 360px; background: #1e293b; border: 3px solid #3b82f6; border-radius: 12px; margin: 10px; }
    .btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; padding: 12px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin-left: 10px; }
    input { padding: 12px 20px; border-radius: 30px; border: none; width: 280px; font-size: 16px; outline: none; background: #1e293b; color: #f8fafc; border: 2px solid #475569; }
    input:focus { border-color: #3b82f6; }
    #peer-id-container { font-size: 20px; margin: 20px 0; }
    #error-log { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px; display: none; margin: 20px auto; max-width: 600px; font-size: 18px; }
    #console-log { text-align: left; background: #1e293b; color: #10b981; font-family: monospace; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 800px; height: 200px; overflow-y: scroll; font-size: 14px; border: 1px solid #475569; }
  </style>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
  <h1>Antigravity P2P Call Room 🚀</h1>
  <p style="color:#64748b;">Videollamada Directa Ultra Ligera con Consola de Logs</p>
  
  <div id="peer-id-container">Tu ID de Conexión: <span id="my-id" style="font-weight:bold;color:#10b981;">Generando...</span></div>
  
  <div id="error-log"></div>
  
  <button id="activate-btn" class="btn" style="background:#10b981;margin-bottom:20px;" onclick="startCamera()">Activar Cámara 📷</button>
  
  <br>
  <div>
    <input type="text" id="dest-id" placeholder="Ingresa el ID del otro dispositivo">
    <button class="btn" onclick="makeCall()">Llamar 📞</button>
  </div>
  <br><br>
  <video id="local-video" autoplay playsinline muted></video>
  <video id="remote-video" autoplay playsinline></video>

  <h3>Consola de Depuración (Logs en vivo):</h3>
  <div id="console-log"></div>

  <script>
    const myIdEl = document.getElementById('my-id');
    const errorLogEl = document.getElementById('error-log');
    const consoleLogEl = document.getElementById('console-log');

    // 1. Redireccionar la consola a la pantalla y al servidor de logs en la PC
    function logToScreen(msg, type = 'info') {
      const p = document.createElement('p');
      p.style.margin = '2px 0';
      if (type === 'error') p.style.color = '#ef4444';
      if (type === 'warn') p.style.color = '#fbbf24';
      p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      consoleLogEl.appendChild(p);
      consoleLogEl.scrollTop = consoleLogEl.scrollHeight;

      // Enviar el log de la TV de forma segura a la PC a través de HTTPS
      fetch("https://shaggy-clowns-take.loca.lt/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, type: type, timestamp: new Date().toISOString() })
      }).catch(err => {});
    }

    const _log = console.log;
    const _error = console.error;
    const _warn = console.warn;

    console.log = function(...args) {
      logToScreen(args.join(' '));
      _log.apply(console, args);
    };
    console.error = function(...args) {
      logToScreen(args.join(' '), 'error');
      _error.apply(console, args);
    };
    console.warn = function(...args) {
      logToScreen(args.join(' '), 'warn');
      _warn.apply(console, args);
    };

    window.onerror = function(message, source, lineno, colno, error) {
      console.error(`GLOBAL ERROR: ${message} en ${source}:${lineno}`);
      return false;
    };

    console.log("Página cargada. Inicializando consola...");

    let localStream;
    let peer;

    function showError(msg) {
      errorLogEl.innerText = msg;
      errorLogEl.style.display = "block";
    }

    // 2. Inicializar PeerJS inmediatamente
    try {
      console.log("Creando instancia PeerJS...");
      peer = new Peer();
      
      peer.on('open', id => {
        console.log("Conectado con éxito a PeerJS. ID asignado: " + id);
        myIdEl.innerText = id;
        errorLogEl.style.display = "none";
      });

      peer.on('disconnected', () => {
        console.warn("PeerJS se desconectó de la red de señalización.");
        showError("Conexión de red perdida. Reconectando... 🔄");
        peer.reconnect();
      });

      peer.on('error', err => {
        console.error("Error reportado por PeerJS: " + err.type + " - " + err.message);
        showError("Error de PeerJS: " + err.type + " - " + err.message);
      });

      peer.on('call', call => {
        console.log("Recibiendo llamada entrante...");
        if (localStream) {
          console.log("Respondiendo con stream existente...");
          call.answer(localStream);
          handleCallStream(call);
        } else {
          console.log("Cámara no activa, intentando iniciar antes de responder...");
          startCamera().then(stream => {
            call.answer(stream);
            handleCallStream(call);
          });
        }
      });
    } catch (e) {
      console.error("Excepción en constructor PeerJS: " + e.message);
      showError("Error al iniciar Peer: " + e.message);
    }

    // 3. Iniciar la cámara con fallback de audio y logs
    function startCamera() {
      console.log("startCamera() ejecutado. Comprobando compatibilidad...");
      
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.error("navigator.mediaDevices o getUserMedia no existen en el navegador.");
        showError("Error de Cámara: La API de video no está soportada o está desactivada en este navegador.");
        return Promise.reject(new Error("getUserMedia not supported"));
      }

      console.log("API mediaDevices detectada. Solicitando video + audio...");
      return navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
          console.log("Acceso a Cámara y Audio concedido con éxito.");
          localStream = stream;
          document.getElementById('local-video').srcObject = stream;
          const btn = document.getElementById('activate-btn');
          if (btn) btn.style.display = 'none';
          return stream;
        })
        .catch(err => {
          console.warn("Fallo solicitud de Video + Audio. Intentando fallback 'Solo Video'...", err.name, err.message);
          showError("Aviso: Iniciando llamada sin micrófono (solo video) debido a: " + err.message);
          
          console.log("Solicitando Solo Video (audio: false)...");
          return navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => {
              console.log("Acceso a Solo Video concedido con éxito.");
              errorLogEl.style.display = "none";
              localStream = stream;
              document.getElementById('local-video').srcObject = stream;
              const btn = document.getElementById('activate-btn');
              if (btn) btn.style.display = 'none';
              return stream;
            })
            .catch(finalErr => {
              console.error("Fallo final al abrir la cámara (Solo Video): " + finalErr.name + " - " + finalErr.message);
              showError("Error de Cámara: " + finalErr.name + " - " + finalErr.message);
              throw finalErr;
            });
        });
    }

    // Intentar inicio automático silencioso en la carga
    console.log("Intentando inicio de cámara inicial al cargar...");
    try {
      startCamera();
    } catch (e) {
      console.warn("Fallo de inicio de cámara al cargar (puede requerir clic en botón): " + e.message);
    }

    function handleCallStream(call) {
      call.on('stream', remoteStream => {
        console.log("Recibido stream de video remoto.");
        document.getElementById('remote-video').srcObject = remoteStream;
      });
    }

    function makeCall() {
      const destId = document.getElementById('dest-id').value;
      console.log("Intentando llamar a Peer ID: " + destId);
      if (!destId) return showError("Por favor ingresa un ID");
      if (!localStream) return showError("Cámara no activa");
      
      const call = peer.call(destId, localStream);
      handleCallStream(call);
    }
  </script>
</body>
</html>
