<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Antigravity P2P Call</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
    h1 { color: #3b82f6; }
    video { width: 45%; max-width: 480px; height: 360px; background: #1e293b; border: 3px solid #3b82f6; border-radius: 12px; margin: 10px; }
    .btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; padding: 12px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin: 10px; }
    #console-log { text-align: left; background: #1e293b; color: #10b981; font-family: monospace; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 800px; height: 200px; overflow-y: scroll; font-size: 14px; border: 1px solid #475569; }
    #status { font-size: 20px; font-weight: bold; color: #fbbf24; margin: 15px 0; }
  </style>
</head>
<body>
  <h1>Antigravity P2P Call Room 🚀</h1>
  <p style="color:#64748b;">Videollamada Directa 100% Vanilla (Sin Librerías Externas)</p>
  
  <div id="status">Estado: Inicializando...</div>
  
  <button id="activate-btn" class="btn" style="background:#10b981;" onclick="startCamera()">1. Activar Cámara 📷</button>
  <button id="call-btn" class="btn" style="background:#3b82f6; display:none;" onclick="startCall()">2. Llamar a la TV 📞</button>
  
  <br><br>
  <video id="local-video" autoplay playsinline muted></video>
  <video id="remote-video" autoplay playsinline></video>

  <h3>Consola de Depuración (Logs en vivo):</h3>
  <div id="console-log"></div>

  <script>
    const statusEl = document.getElementById('status');
    const consoleLogEl = document.getElementById('console-log');
    const activateBtn = document.getElementById('activate-btn');
    const callBtn = document.getElementById('call-btn');

    const SIGNAL_URL = "https://d4150aebe2c88b.lhr.life";

    // 1. Redireccionar consola a pantalla y servidor remoto
    function logToScreen(msg, type = 'info') {
      const p = document.createElement('p');
      p.style.margin = '2px 0';
      if (type === 'error') p.style.color = '#ef4444';
      if (type === 'warn') p.style.color = '#fbbf24';
      p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      consoleLogEl.appendChild(p);
      consoleLogEl.scrollTop = consoleLogEl.scrollHeight;

      if (SIGNAL_URL && !SIGNAL_URL.startsWith("SIGNAL")) {
        fetch(SIGNAL_URL + "/log", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, type: type, timestamp: new Date().toISOString() })
        }).catch(() => {});
      }
    }

    console.log = function(...args) { logToScreen(args.join(' ')); };
    console.error = function(...args) { logToScreen(args.join(' '), 'error'); };
    console.warn = function(...args) { logToScreen(args.join(' '), 'warn'); };

    window.onerror = function(message, source, lineno, colno, error) {
      console.error(`GLOBAL ERROR: ${message} en ${source}:${lineno}`);
      return false;
    };

    console.log("Página cargada. Inicializando aplicación Vanilla WebRTC...");

    // 2. Determinar si es TV (Host) o PC/Móvil (Caller)
    const isTV = !window.location.search.includes("caller");
    if (isTV) {
      statusEl.innerText = "Modo: TELEVISIÓN (Esperando llamada...)";
      console.log("Iniciando en modo TELEVISIÓN.");
    } else {
      statusEl.innerText = "Modo: EMISOR (Laptop/Celular)";
      console.log("Iniciando en modo EMISOR.");
      callBtn.style.display = "inline-block";
    }

    let localStream;
    let peerConnection;
    let ws;

    // Configuración STUN gratuita de Google
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // 3. Conectarse al Servidor de Señalización
    function connectSignal() {
      if (SIGNAL_URL.startsWith("SIGNAL")) return console.warn("Servidor de señalización no configurado aún.");
      
      const wsUrl = SIGNAL_URL.replace("https://", "wss://") + "/signal";
      console.log("Conectando WebSocket a: " + wsUrl);
      
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        console.log("WebSocket conectado. Registrando rol...");
        ws.send(JSON.stringify({ type: 'register', role: isTV ? 'tv' : 'caller' }));
        statusEl.innerText = isTV ? "Modo: TELEVISIÓN (Conectado a señalización ✅)" : "Modo: EMISOR (Conectado a señalización ✅)";
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        console.log("Mensaje recibido del servidor: " + msg.type);
        
        if (msg.type === 'offer') {
          handleOffer(msg.offer);
        } else if (msg.type === 'answer') {
          handleAnswer(msg.answer);
        } else if (msg.type === 'candidate') {
          handleCandidate(msg.candidate);
        }
      };

      ws.onclose = () => {
        console.warn("WebSocket cerrado. Reconectando en 3s...");
        setTimeout(connectSignal, 3000);
      };

      ws.onerror = (err) => {
        console.error("Error en WebSocket. Puede deberse a CORS o de red.");
      };
    }

    connectSignal();

    // 4. Iniciar Cámara
    function startCamera() {
      console.log("startCamera() ejecutado. Comprobando WebRTC...");
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.error("getUserMedia no soportado en este navegador.");
        statusEl.innerText = "Error: Cámara no soportada en este navegador.";
        return;
      }

      console.log("Solicitando cámara (video: true, audio: false)...");
      return navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
          console.log("Cámara iniciada con éxito.");
          localStream = stream;
          document.getElementById('local-video').srcObject = stream;
          activateBtn.style.display = 'none';
          
          // Si ya existe la conexión, añadir tracks
          if (peerConnection) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
          }
        })
        .catch(err => {
          console.error("Error de Cámara: " + err.name + " - " + err.message);
        });
    }

    // El inicio de cámara se hará únicamente mediante clic del usuario en el botón para evitar bloqueos del navegador.

    // 5. Gestión de WebRTC
    function createPeerConnection() {
      console.log("Creando RTCPeerConnection...");
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          console.log("Enviando candidato ICE local...");
          ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };

      peerConnection.ontrack = (event) => {
        console.log("Recibido track de video remoto.");
        document.getElementById('remote-video').srcObject = event.streams[0];
      };

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
    }

    // El Emisor inicia la llamada
    function startCall() {
      console.log("Iniciando llamada WebRTC...");
      createPeerConnection();
      
      peerConnection.createOffer()
        .then(offer => peerConnection.setLocalDescription(offer))
        .then(() => {
          console.log("Enviando oferta SDP a la TV...");
          ws.send(JSON.stringify({ type: 'offer', offer: peerConnection.localDescription }));
        })
        .catch(err => console.error("Error al crear oferta: " + err.message));
    }

    // La TV maneja la oferta de la llamada
    function handleOffer(offer) {
      console.log("Recibida oferta de llamada. Respondiendo...");
      createPeerConnection();
      
      peerConnection.setRemoteDescription(new RTCSessionDescription(offer))
        .then(() => peerConnection.createAnswer())
        .then(answer => peerConnection.setLocalDescription(answer))
        .then(() => {
          console.log("Enviando respuesta SDP al Emisor...");
          ws.send(JSON.stringify({ type: 'answer', answer: peerConnection.localDescription }));
        })
        .catch(err => console.error("Error al responder oferta: " + err.message));
    }

    function handleAnswer(answer) {
      console.log("Recibida respuesta SDP. Estableciendo conexión...");
      peerConnection.setRemoteDescription(new RTCSessionDescription(answer))
        .catch(err => console.error("Error al setear descripción remota: " + err.message));
    }

    function handleCandidate(candidate) {
      console.log("Agregando candidato ICE remoto...");
      peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
        .catch(err => console.error("Error al agregar candidato: " + err.message));
    }
  </script>
</body>
</html>
