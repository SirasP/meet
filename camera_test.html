<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prueba de Cámara Autocontenida</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
    h1 { color: #10b981; }
    video { width: 90%; max-width: 640px; height: 480px; background: #1e293b; border: 3px solid #10b981; border-radius: 12px; margin-top: 20px; }
    button { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 15px 40px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 18px; margin: 15px; }
    #console-log { text-align: left; background: #1e293b; color: #10b981; font-family: monospace; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 800px; height: 250px; overflow-y: scroll; font-size: 14px; border: 1px solid #475569; }
    #errorMsg { color: #ef4444; font-size: 18px; margin: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Test de Cámara Autocontenida (Sin dependencias) 📷</h1>
  <p>Esta página NO carga ningún script externo para evitar bloqueos del navegador de la TV.</p>

  <video id="gum-local" autoplay playsinline muted></video>
  <br>
  <button id="showVideo" onclick="init(this)">Open camera</button>

  <div id="errorMsg"></div>

  <h3>Consola de Logs en Pantalla:</h3>
  <div id="console-log"></div>

  <script>
    // 1. Configurar Consola de Logs al inicio para capturar todo
    const consoleLogEl = document.getElementById('console-log');
    function logToScreen(msg, type = 'info') {
      const p = document.createElement('p');
      p.style.margin = '2px 0';
      if (type === 'error') p.style.color = '#ef4444';
      if (type === 'warn') p.style.color = '#fbbf24';
      p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      consoleLogEl.appendChild(p);
      consoleLogEl.scrollTop = consoleLogEl.scrollHeight;
    }
    console.log = function(...args) { logToScreen(args.join(' ')); };
    console.error = function(...args) { logToScreen(args.join(' '), 'error'); };
    console.warn = function(...args) { logToScreen(args.join(' '), 'warn'); };

    window.onerror = function(message, source, lineno, colno, error) {
      console.error(`GLOBAL ERROR: ${message} en ${source}:${lineno}`);
      return false;
    };

    console.log("Página cargada. Esperando interacción...");

    async function init(btnElement) {
      console.log("Botón presionado. Iniciando solicitud...");
      
      // Comprobar soporte de la API
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.error("navigator.mediaDevices.getUserMedia no soportado en esta TV.");
        document.getElementById('errorMsg').innerText = "navigator.mediaDevices.getUserMedia no soportado.";
        return;
      }

      const constraints = {
        audio: false,
        video: true
      };

      try {
        console.log("Llamando a getUserMedia con constraints: video=true, audio=false");
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        console.log("¡Cámara iniciada con éxito! Asignando stream...");
        document.getElementById('gum-local').srcObject = stream;
        btnElement.style.display = 'none';
      } catch (err) {
        console.error("Error en getUserMedia: " + err.name + " - " + err.message);
        document.getElementById('errorMsg').innerText = "Error: " + err.name + " - " + err.message;
      }
    }
  </script>
</body>
</html>
